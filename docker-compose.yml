version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-worldcup-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_worldcup
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ai-worldcup-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_worldcup"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-worldcup-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ai-worldcup-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ai-worldcup-pg:
  ai-worldcup-redis:
