# AI WorldCup production Nginx configuration
# Domains:
#   API:   http://api.qiuduoduo.online
#   H5:    http://h5.qiuduoduo.online and http://82.157.76.140:8080
#   Admin: http://admin.qiuduoduo.online and http://82.157.76.140:8081

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ai_worldcup_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.qiuduoduo.online;

    access_log /var/log/nginx/api.qiuduoduo.access.log;
    error_log  /var/log/nginx/api.qiuduoduo.error.log;

    client_max_body_size 20m;

    location = /health {
        proxy_pass http://ai_worldcup_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://ai_worldcup_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /github-webhook {
        proxy_pass http://127.0.0.1:9000/github-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name h5.qiuduoduo.online;

    root /var/www/ai-worldcup;
    index index.html;

    access_log /var/log/nginx/h5.qiuduoduo.access.log;
    error_log  /var/log/nginx/h5.qiuduoduo.error.log;

    include /etc/nginx/snippets/ai-worldcup-spa-common.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.qiuduoduo.online;

    root /var/www/ai-worldcup-admin;
    index index.html;

    access_log /var/log/nginx/admin.qiuduoduo.access.log;
    error_log  /var/log/nginx/admin.qiuduoduo.error.log;

    include /etc/nginx/snippets/ai-worldcup-spa-common.conf;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ 82.157.76.140;

    root /var/www/ai-worldcup;
    index index.html;

    access_log /var/log/nginx/ai-worldcup.access.log;
    error_log  /var/log/nginx/ai-worldcup.error.log;

    include /etc/nginx/snippets/ai-worldcup-spa-common.conf;
}

server {
    listen 8080;
    server_name _;

    root /var/www/ai-worldcup;
    index index.html;

    access_log /var/log/nginx/h5-ip.access.log;
    error_log  /var/log/nginx/h5-ip.error.log;

    include /etc/nginx/snippets/ai-worldcup-spa-common.conf;
}

server {
    listen 8081;
    server_name _;

    root /var/www/ai-worldcup-admin;
    index index.html;

    access_log /var/log/nginx/admin-ip.access.log;
    error_log  /var/log/nginx/admin-ip.error.log;

    include /etc/nginx/snippets/ai-worldcup-spa-common.conf;
}
